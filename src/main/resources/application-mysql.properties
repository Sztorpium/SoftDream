# ========================================
# MYSQL DATABASE (Local XAMPP or Remote)
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/softdream_hotel?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Europe/Budapest&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA/HIBERNATE (MySQL-specific)
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

spring.sql.init.mode=embedded
spring.jpa.defer-datasource-initialization=true


# ========================================
# CONNECTION POOLING
# ========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
