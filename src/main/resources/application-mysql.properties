# ========================================
# MYSQL ADATBÁZIS (helyi XAMPP vagy távoli)
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/softdream_hotel?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Europe/Budapest&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================
# JPA/HIBERNATE (MySQL-specifikus)
# ========================================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# ADATINICIALIZÁLÁS
# Az sql.init.mode=embedded azt jelenti, hogy a data.sql csak beágyazott (H2) adatbázisoknál fut.
# A referenciaadatokat helyette a DataInitializerService seedeli (idempotens, adatbázisfüggetlen).
spring.sql.init.mode=embedded
spring.jpa.defer-datasource-initialization=true

# ========================================
# KAPCSOLATPOOL KEZELÉS
# ========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000