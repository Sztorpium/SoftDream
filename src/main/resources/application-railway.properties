# ========================================
# POSTGRESQL ADATBÁZIS (Railway.app éles)
# ========================================
# A Railway postgresql://... formátumban biztosítja a DATABASE_URL változót.
# Használd a JDBC_DATABASE_URL (jdbc:postgresql://...) változót, ha a Railway plugin beállítja,
# vagy állítsd be kézzel így: jdbc:postgresql://<host>/<db>?user=<u>&******
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.auto-commit=false

# ========================================
# JPA/HIBERNATE (PostgreSQL-specifikus)
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# ADATINICIALIZÁLÁS
spring.jpa.defer-datasource-initialization=true

# ========================================
# KAPCSOLATPOOL KEZELÉS
# ========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000