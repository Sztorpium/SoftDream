# ========================================
# POSTGRESQL DATABASE (Railway.app Production)
# ========================================
# Railway provides DATABASE_URL in postgresql://... format.
# Use JDBC_DATABASE_URL (jdbc:postgresql://...) if your Railway plugin sets it,
# or set it manually as: jdbc:postgresql://<host>/<db>?user=<u>&password=<p>
spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.auto-commit=false

# ========================================
# JPA/HIBERNATE (PostgreSQL-specific)
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# DATA INITIALIZATION
spring.jpa.defer-datasource-initialization=true

# ========================================
# CONNECTION POOLING
# ========================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
