# Active Profile - Default to H2 for development
spring.profiles.active=h2

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# JPA/Hibernate Common Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.hu.softdream=DEBUG

# JWT Configuration
# IMPORTANT: Set JWT_SECRET environment variable in production!
# The default value is for development only and should never be used in production
jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_THIS_IS_ONLY_FOR_DEVELOPMENT}
jwt.expiration=86400000

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
