# ========================================
# SERVER CONFIGURATION
# ========================================
server.port=8080

# ========================================
# SPRING PROFILE SELECTION
# ========================================
# Options: dev (H2), mysql, railway
# Override at runtime via: SPRING_PROFILES_ACTIVE=railway
spring.profiles.active=dev

# ========================================
# JPA/HIBERNATE CONFIGURATION
# ========================================
# ddl-auto is intentionally NOT set here - each profile defines its own value
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.root=WARN
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
logging.level.hu.softdream=DEBUG

# ========================================
# JWT CONFIGURATION
# ========================================
# JWT_SECRET must be a Base64-encoded string of at least 256 bits.
# Set via environment variable: JWT_SECRET=<your-base64-encoded-secret>
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========================================
# ADMIN CONFIGURATION
# ========================================
# Password for the seeded admin_user account. MUST be overridden in production.
# Set via environment variable: ADMIN_PASSWORD=<your-secure-password>

# ========================================
# CORS CONFIGURATION
# ========================================
# Comma-separated list of allowed origins.
# Set via environment variable for production: CORS_ALLOWED_ORIGINS=https://your-frontend.railway.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:4200}

# ========================================
# MAIL CONFIGURATION
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
