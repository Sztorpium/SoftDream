# ========================================
# SERVER CONFIGURATION
# ========================================
server.port=8080

# ========================================
# SPRING PROFILE SELECTION
# ========================================
# Options: dev (H2), mysql, railway
spring.profiles.active=mysql

# ========================================
# JPA/HIBERNATE CONFIGURATION
# ========================================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# LOGGING CONFIGURATION
# ========================================
logging.level.root=WARN
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=INFO
logging.level.hu.softdream=DEBUG

# ========================================
# JWT CONFIGURATION
# ========================================
jwt.secret=${JWT_SECRET:dGhpc2lzYXZlcnlsb25nand0c2VjcmV0a2V5Zm9yc29mdGRyZWFtYXBwbGljYXRpb24h}
jwt.expiration=${JWT_EXPIRATION:86400000}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:4200,http://localhost:8080,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:4200}

# ========================================
# MAIL CONFIGURATION
# ========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
