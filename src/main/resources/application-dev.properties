# ========================================
# H2 MEMÓRIÁBAN LÉV? ADATBÁZIS (fejlesztés/tesztelés)
# ========================================
spring.datasource.url=jdbc:h2:mem:softdream_hotel;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ========================================
# H2 KONZOL (webes adatbázis felület)
# ========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# ========================================
# JPA/HIBERNATE (H2-specifikus)
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop


# ADATINICIALIZÁLÁS (a data.sql automatikusan fut beágyazott adatbázisoknál)
spring.sql.init.mode=embedded
spring.jpa.defer-datasource-initialization=true


# ========================================
# NAPLÓZÁS (fejlesztés - részletes)
# ========================================
logging.level.org.springframework.security=DEBUG
logging.level.hu.softdream=DEBUG
