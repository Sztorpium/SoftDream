# ========================================
# H2 IN-MEMORY DATABASE (Development/Testing)
# ========================================
spring.datasource.url=jdbc:h2:mem:softdream_hotel;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ========================================
# H2 CONSOLE (Web Interface for Database)
# ========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# ========================================
# JPA/HIBERNATE (H2-specific)
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# DATA INITIALIZATION (data.sql runs automatically for embedded DBs)
spring.sql.init.mode=embedded
spring.jpa.defer-datasource-initialization=true

# ========================================
# LOGGING (Development - verbose)
# ========================================
logging.level.org.springframework.security=DEBUG
logging.level.hu.softdream=DEBUG
